name: Feature request
description: Suggest a model, backend, optimization, or API improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What use case should this enable?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the desired behavior or API.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Model family, target backend, benchmark target, or related references.
    validations:
      required: false
