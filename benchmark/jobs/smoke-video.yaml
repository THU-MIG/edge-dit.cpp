# edge-only smoke: verify each edge-dit text-to-video config generates a sane video.
# Mirror of video.yaml's edge-dit section, 1 prompt per config (fast visual check).
# Sentinels (expected OOM) kept intentionally. No diffusers/sd.cpp sections.
name: smoke-video
task: text-to-video
prompts: 1
device: 0

edge-dit:
  model: [wan2-t2v-1.3b]                               # small: fp16 resident
  quant:
    - fp16
    - q8
    - q4_k
    - {model: wan21-t2v-1.3b-distill, type: fp16}
    - {model: wan21-t2v-1.3b-distill, type: q8}
    - {model: wan21-t2v-1.3b-distill, type: q4_k}