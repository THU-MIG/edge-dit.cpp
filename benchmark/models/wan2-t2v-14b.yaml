schema_version: 1
model_id: wan2-t2v-14b
model_family: Wan
model_name: Wan 2.1 T2V 14B
task: text-to-video
distilled: false
model:
  public_id: Wan-AI/Wan2.1-T2V-14B-Diffusers
  local_path_ref: wan2_t2v_14b_dir
  format: diffusers-directory
prompt_set: ../prompts/text-to-video-v1.jsonl
generation:                            # video defaults 832x480 / 9 frames / 20 steps
  width: 832
  height: 480
  frames: 9
  fps: 16
  steps: 20
  guidance: 1.0                        # Wan uses CFG (cfg_scale), not distilled guidance
  cfg_scale: 5.0                        # Wan official CFG=5.0 (two forward passes)
  flow_shift: 3.0                       # 3.0 for 480P (832x480), 5.0 for 720P
  scheduler: model-default
