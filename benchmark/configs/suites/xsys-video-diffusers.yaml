schema_version: 1
suite_id: xsys-video-diffusers
description: Cross-system matrix (xsys-video-diffusers). precision x budget x prompt. vae-tiling on. OOM recorded, skip.
mode: pilot
defaults:
  warmup_runs: 0
  measured_runs: 1
  output_encoding_in_core_latency: false
  memory_measurement: external
hardware:
  - ../hardware/h200-local.yaml
systems:
  single_gpu:
    - ../systems/diffusers.yaml
workloads:
  single_gpu:
    - ../workloads/wan2-t2v-832x480-f9-s20.yaml
scenario_matrix:
  axes:
    - axis: precision
      values:
        - id: bf16
          options: {vae_tiling: true}
        - id: w8a8
          options: {quant_weights: qint8, quant_activations: qint8, vae_tiling: true}
        - id: fp8
          options: {quant_weights: qfloat8, quant_activations: qfloat8, vae_tiling: true}
    - axis: budget
      values:
        - id: 24g
          vram_constraint_gib: 24
          options: {}
        - id: offload
          vram_constraint_gib: 8
          options: {offload: true}
    - axis: prompt
      values:
        - id: p0
          options: {prompt_id: wan_teapot_rotation}
        - id: p1
          options: {prompt_id: matrix_video_robot_plaza}
        - id: p2
          options: {prompt_id: matrix_video_bicycle_rain}
reporting:
  table: cross_system_matrix
  require_environment_metadata: false
