method_id: fp8
kind: runtime
category: quant
description: >
  diffusers FP8 weight-only via Optimum-Quanto (qfloat8_e4m3fn weights, activations
  in fp16). diffusers-only 8-bit tier. NOTE: qfloat8's e4m3 3-bit mantissa is too
  coarse for 2B MMDiT models -- SD3-medium goes dark and SD3.5-turbo gets noisy under
  fp8 (per-linear rel-err ~5.7% vs ~0.5% for int8). So SD3 / SD3.5-turbo use the `w8`
  method (qint8 weight-only) instead; fp8 stays qfloat8 for larger models (flux/qwen).
options: {quant_weights: qfloat8, quant_activations: none}
cross_system: [diffusers]
convert_default: false
