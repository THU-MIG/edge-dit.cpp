schema_version: 1
workload_id: flux-kontext-edit-1024-s20
model_family: FLUX.1-Kontext
model_name: FLUX.1-Kontext-dev
task: image-editing
model:
  public_id: black-forest-labs/FLUX.1-Kontext-dev
  local_path_ref: flux_kontext_dir
  format: diffusers-directory
