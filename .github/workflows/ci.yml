name: CI

on:
  push:
    branches: [main, lym]
  pull_request:
    branches: [main]

jobs:
  cpu-build:
    name: CPU build and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3

      - name: Configure
        run: |
          cmake -S . -B build-cpu-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DED_BUILD_EXAMPLES=ON \
            -DED_BUILD_TESTS=ON \
            -DED_ENABLE_NCCL=OFF \
            -DED_ENABLE_MPI=OFF

      - name: Build
        run: cmake --build build-cpu-ci -j"$(nproc)"

      - name: CLI smoke
        run: ./build-cpu-ci/bin/ed-cli --help

      - name: CTest
        run: ctest --test-dir build-cpu-ci --output-on-failure

  python:
    name: Python tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python package
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Pytest
        working-directory: bindings/python
        run: pytest
