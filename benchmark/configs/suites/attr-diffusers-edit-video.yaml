schema_version: 1
suite_id: attr-diffusers-edit-video
description: >
  Attribution verify for diffusers non-T2I pipelines (FluxKontext edit + Wan
  video) with CPU offload (+qint8 for kontext) to fit 24G. Confirms transformer
  forward-hook and vae.decode wrapper emit all three phase markers.
mode: smoke
defaults:
  warmup_runs: 0
  measured_runs: 1
  output_encoding_in_core_latency: false
  memory_measurement: external
hardware:
  - ../hardware/h200-local.yaml
systems:
  single_gpu:
    - ../systems/diffusers.yaml
workloads:
  single_gpu:
    - ../workloads/flux-kontext-edit-1024-s1-smoke.yaml
    - ../workloads/wan2-t2v-832x480-f9-s1-smoke.yaml
scenarios:
  - scenario_id: offload
    options:
      precision: bf16
      offload: true
reporting:
  table: attr_diffusers_edit_video
  generate_public_tables: false
