schema_version: 1
suite_id: xsys-sdcpp
description: >
  Cross-system matrix (stable-diffusion.cpp side). Precision (f16/q8_0/q4_K) x
  VRAM-budget (max-vram) x prompt. vae-tiling always on. OOM recorded, skip.
mode: pilot
defaults:
  warmup_runs: 0
  measured_runs: 1
  output_encoding_in_core_latency: false
  memory_measurement: external
hardware:
  - ../hardware/h200-local.yaml
systems:
  single_gpu:
    - ../systems/stable-diffusion-cpp.yaml
workloads:
  single_gpu:
    - ../workloads/sd3-medium-t2i-1024-s20.yaml
    - ../workloads/flux1-dev-t2i-1024-s20.yaml
    - ../workloads/qwen-image-t2i-1024-s20.yaml
scenario_matrix:
  axes:
    - axis: precision
      values:
        - id: f16
          options: {precision: f16, vae_tiling: true}
        - id: q8
          options: {precision: q8_0, vae_tiling: true}
        - id: q4
          options: {precision: q4_K, vae_tiling: true}
    - axis: budget
      values:
        - id: 24g
          vram_constraint_gib: 24
          options: {}
        - id: 16g
          vram_constraint_gib: 16
          options: {max_vram_gib: 16}
        - id: 8g
          vram_constraint_gib: 8
          options: {offload_to_cpu: true, max_vram_gib: 8}
    - axis: prompt
      values:
        - id: p0
          options: {prompt_id: cache_glass_teapot}
        - id: p1
          options: {prompt_id: cache_city_robot}
        - id: p2
          options: {prompt_id: cache_library_atrium}
reporting:
  table: cross_system_matrix
  require_environment_metadata: false
