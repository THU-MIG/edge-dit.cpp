# text-to-video benchmark manifest: cross-system compare. Wan is 832x480, few frames.
# Per model: fp16/bf16 baseline (large via offload+max_vram), q8/q4_k resident, edge-only
# offload/auto tiers. Rows grouped by model.
# stable-diffusion.cpp: loads Wan from the official Comfy-Org repackaged component files
# (DiT + wan VAE + umt5), not the diffusers transformer/ layout (which sd.cpp can't read).
# Distilled wan21-t2v-1.3b-distill is transformer-only -> edge only.
name: video
task: text-to-video
prompts: 3
warmup: 1
device: 0

edge-dit:
  model: [wan2-t2v-1.3b]                               # small: fp16 resident
  quant:
    - fp16
    - q8
    - q4_k
    - {model: wan21-t2v-1.3b-distill, type: fp16}
    - {model: wan21-t2v-1.3b-distill, type: q8}
    - {model: wan21-t2v-1.3b-distill, type: q4_k}
diffusers:                            # full-directory Wan only (transformer-only distill unsupported)
  model: [wan2-t2v-1.3b]
  quant:
    - bf16
    - w8
stable-diffusion.cpp:                 # official Comfy-Org component files (see model yaml refs)
  model: [wan2-t2v-1.3b]
  quant:
    - fp16
    - q8
    - q4_k