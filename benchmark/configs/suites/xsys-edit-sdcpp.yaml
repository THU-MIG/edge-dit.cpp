schema_version: 1
suite_id: xsys-edit-sdcpp
description: Cross-system matrix (xsys-edit-sdcpp). precision x budget x prompt. vae-tiling on. OOM recorded, skip.
mode: pilot
defaults:
  warmup_runs: 0
  measured_runs: 1
  output_encoding_in_core_latency: false
  memory_measurement: external
hardware:
  - ../hardware/h200-local.yaml
systems:
  single_gpu:
    - ../systems/stable-diffusion-cpp.yaml
workloads:
  single_gpu:
    - ../workloads/flux-kontext-edit-1024-s20.yaml
scenario_matrix:
  axes:
    - axis: precision
      values:
        - id: f16
          options: {precision: f16, vae_tiling: true}
        - id: q8
          options: {precision: q8_0, vae_tiling: true}
        - id: q4
          options: {precision: q4_K, vae_tiling: true}
    - axis: budget
      values:
        - id: 24g
          vram_constraint_gib: 24
          options: {}
        - id: 16g
          vram_constraint_gib: 16
          options: {max_vram_gib: 16}
        - id: 8g
          vram_constraint_gib: 8
          options: {offload_to_cpu: true, max_vram_gib: 8}
    - axis: prompt
      values:
        - id: p0
          options: {prompt_id: flux_kontext_brushed_metal}
        - id: p1
          options: {prompt_id: qwen_edit_studio_background}
        - id: p2
          options: {prompt_id: matrix_edit_watercolor}
reporting:
  table: cross_system_matrix
  require_environment_metadata: false
