schema_version: 1
model_id: wan2-t2v-1.3b
model_family: Wan
model_name: Wan 2.1 T2V 1.3B
task: text-to-video
distilled: false
model:
  public_id: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
  local_path_ref: wan2_t2v_1.3b_dir
  format: diffusers-directory
  # sd.cpp: official Comfy-Org repackaged component files (sd.cpp reads Wan natively via
  # these; the diffusers transformer/ layout is NOT recognized by sd.cpp).
  stable_diffusion_cpp_wan_dit: wan2_t2v_1.3b_sdcpp_dit
  stable_diffusion_cpp_wan_vae: wan2_1_sdcpp_vae
  stable_diffusion_cpp_wan_t5: wan2_1_sdcpp_umt5
prompt_set: ../prompts/text-to-video-v1.jsonl
generation:
  width: 832
  height: 480
  frames: 41
  fps: 16
  steps: 30
  guidance: 1.0                        # Wan uses CFG (cfg_scale), not distilled guidance
  cfg_scale: 5.0                        # Wan official CFG=5.0 (two forward passes)
  flow_shift: 3.0                       # 3.0 for 480P (832x480), 5.0 for 720P
  scheduler: model-default
