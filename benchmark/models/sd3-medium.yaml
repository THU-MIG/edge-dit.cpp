schema_version: 1
model_id: sd3-medium
model_family: SD3
model_name: Stable Diffusion 3 Medium
task: text-to-image
distilled: false                       # not distilled; steps use default_steps below
model:
  public_id: stabilityai/stable-diffusion-3-medium
  local_path_ref: sd3_medium_dir       # actual path resolved in site config
  format: diffusers-directory
  # sd.cpp: prefer the official all-in-one single file (native load, sharp output).
  # The diffusers-preconverted transformer below is a fallback (produces blurry output).
  stable_diffusion_cpp_single_file: sd3_medium_official_file
  stable_diffusion_cpp_transformer_ref: sd3_medium_sdcpp_transformer
prompt_set: ../prompts/text-to-image-v1.jsonl
generation:                            # defaults; job steps/quant can override
  width: 1024
  height: 1024
  steps: 20                            # SD3 baseline (matches prior 20-step benchmark)
  guidance: 3.5                         # SD3 ignores distilled guidance; true CFG lives in cfg_scale
  cfg_scale: 5.0                        # SD3 CFG (true classifier-free guidance)
  flow_shift: 3.0                       # SD3 flow scheduler shift
  scheduler: model-default
