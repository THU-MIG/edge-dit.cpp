method_id: w8
kind: runtime
category: quant
description: >
  diffusers weight-only int8 via Optimum-Quanto (qint8 weights, activations left in
  fp16). Mirrors edge/sd.cpp's q8_0 (also int8 weight-only), so it is the honest 8-bit
  tier for SD3 / SD3.5-turbo: qfloat8 (the `fp8` method) has an e4m3 3-bit mantissa too
  coarse for 2B MMDiT (SD3 goes dark, turbo gets noisy), while qint8 tracks the bf16
  baseline. Use this for SD3 / SD3.5-turbo; larger models (flux/qwen) can still use `fp8`
  (qfloat8).
options: {quant_weights: qint8, quant_activations: none}
cross_system: [diffusers]
convert_default: false
