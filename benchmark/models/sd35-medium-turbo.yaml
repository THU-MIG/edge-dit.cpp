schema_version: 1
model_id: sd35-medium-turbo
model_family: SD3.5
model_name: Stable Diffusion 3.5 Medium Turbo
task: text-to-image
supported_systems: [edge-dit, diffusers]
distilled: true                        # distilled: engine detect_distilled_default_steps auto-reduces steps
model:
  public_id: tensorart/stable-diffusion-3.5-medium-turbo
  local_path_ref: sd35_medium_turbo_dir # add this ref in site
  format: diffusers-directory           # full diffusers directory, loadable standalone
prompt_set: ../prompts/text-to-image-v1.jsonl
generation:
  width: 1024
  height: 1024
  steps: 8                             # HF card: num_inference_steps=8 (was 4: too few, collapses structure)
  guidance: 3.5                        # NO EFFECT on SD3 (sd3 pipeline ignores distilled guidance); kept only
                                       # because the runner requires the key. SD3's real knob is cfg_scale below.
  cfg_scale: 1.5                       # HF card guidance_scale=1.5 == SD3 true CFG == cfg_scale. cfg 1.0 collapses
                                       # geometry; 1.5 verified good on 2 prompts, CUDA==Vulkan.
  flow_shift: 3.0                      # SD3 flow-scheduler default (base sd3-medium uses 3.0; turbo omitted it)
  scheduler: model-default
