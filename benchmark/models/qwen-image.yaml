schema_version: 1
model_id: qwen-image
model_family: Qwen-Image
model_name: Qwen-Image
task: text-to-image
supported_systems: [edge-dit, diffusers, stable-diffusion-cpp]
distilled: false
model:
  public_id: Qwen/Qwen-Image
  local_path_ref: qwen_image_dir
  format: diffusers-directory
prompt_set: ../prompts/text-to-image-v1.jsonl
generation:                            # defaults; job can override
  width: 1024
  height: 1024
  steps: 30                            # Qwen-Image official recommends 30-50
  guidance: 1.0                        # Qwen-Image: guidance_scale=1.0 (official); true CFG is cfg_scale
  cfg_scale: 4.0                        # Qwen-Image uses CFG (two forward passes)
  scheduler: model-default
