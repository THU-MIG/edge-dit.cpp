# Text-to-video task: Wan 1.3b + distilled. Video metrics (per-frame CLIP/aesthetic,
# temporal consistency) auto-selected by task. sd.cpp loads Wan from the official
# Comfy-Org component files (DiT + wan VAE + umt5, via the model yaml refs).
name: example-video
task: text-to-video
prompts: 3

edge-dit:
  model: [wan2-t2v-1.3b, wan21-t2v-1.3b-distill]
  quant:
    - fp16
    - q8
diffusers:
  model: [wan2-t2v-1.3b]
  quant: [bf16]
stable-diffusion.cpp:                 # official Comfy-Org component files (see model yaml refs)
  model: [wan2-t2v-1.3b]
  quant:
    - fp16
    - q8
